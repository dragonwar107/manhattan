<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">
    
    <title>Gym Lifting Hero 3D - Il Tempio della Ghisa</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka One', cursive, sans-serif;
        }
        
        body {
            background: linear-gradient(180deg, #111827 0%, #030712 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Schermata di Caricamento */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1f2937 0%, #030712 100%);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .loader-title {
            font-size: 36px;
            color: #fbbf24;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 4px 0 #b45309, 0 6px 10px rgba(0,0,0,0.5);
        }
        .loader-spinner {
            width: 60px; height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #fbbf24;
            animation: spin 0.8s linear infinite;
            margin-top: 30px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modale Avanzamento */
        #custom-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(5px);
            z-index: 200; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.2s ease;
        }
        #custom-modal.show { opacity: 1; visibility: visible; }
        .modal-content {
            background: #1f2937; width: 88vw; max-width: 340px;
            padding: 26px; border-radius: 24px; border: 4px solid #fbbf24;
            text-align: center; box-shadow: 0 10px 0 #b45309;
        }
        .modal-text { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; color: #f9fafb; line-height: 1.5; margin-bottom: 22px; }
        .modal-btn {
            background: #10b981; border: none; color: white; padding: 14px;
            font-size: 18px; text-transform: uppercase; border-radius: 18px;
            width: 100%; box-shadow: 0 5px 0 #047857; cursor: pointer;
            text-shadow: 1px 1px 0px #022c22;
        }

        /* Intestazione */
        header {
            width: 100%;
            text-align: center;
            padding-top: 10px;
            z-index: 10;
        }
        h1 {
            font-size: 26px;
            color: #fbbf24;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            text-shadow: 0 4px 0 #b45309, 0 5px 0px #000000;
            letter-spacing: 0.5px;
        }
        
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 92vw;
            max-width: 360px;
            margin: 0 auto;
        }
        .stat-card {
            background: #1f2937;
            padding: 6px 8px;
            border-radius: 14px;
            box-shadow: 0 4px 0 #111827;
            border: 2px solid #374151;
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
        }
        .stat-card span {
            display: block;
            font-size: 15px;
            color: #ffffff;
            margin-top: 2px;
            text-shadow: 0 2px 0 #000000;
        }
        .stat-card span b { color: #f43f5e; }
        .stat-card span.green-glow b { color: #10b981; }

        /* Contenitore Combo */
        .combo-container {
            width: 92vw;
            max-width: 360px;
            margin: 8px auto 0 auto;
            background: #111827;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #374151;
        }
        .combo-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #f43f5e, #f59e0b);
            transition: width 0.1s linear;
        }
        .combo-text {
            position: absolute;
            width: 100%; height: 100%; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 1.5px 0 #000000;
        }

        /* Finestra Arena 3D (Ottimizzata in altezza per lasciare spazio sotto) */
        #arena {
            width: 92vw;
            max-width: 360px;
            height: 34vh;
            max-height: 260px;
            background-color: #242933;
            border: 4px solid #374151;
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.5);
            margin: 8px 0;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #nome-palestra {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #ffffff;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            padding: 5px 12px;
            border-radius: 16px;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 0 #7f1d1d, 0 4px 8px rgba(0,0,0,0.3);
            z-index: 15;
            white-space: nowrap;
            text-shadow: 0 1.5px 0 #000000;
        }

        /* Nuvoletta Incitamento Coach */
        #fumetto {
            position: absolute; top: 56px; left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: #ffffff; color: #111827;
            padding: 6px 12px; border-radius: 14px;
            font-size: 11px; max-width: 200px; text-align: center;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            border: 2px solid #000000;
            opacity: 0; transition: all 0.15s ease; z-index: 20;
        }

        /* Barra Progresso Livello */
        .level-progress-container {
            width: 92vw;
            max-width: 360px;
            height: 14px;
            background: #1f2937;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #374151;
            margin-bottom: 6px;
        }
        .level-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
            transition: width 0.2s ease;
        }

        /* Testo Fluttuante Cartoon */
        .floating-text {
            position: absolute; color: #fbbf24; font-size: 26px; pointer-events: none; z-index: 25;
            text-shadow: 0 3px 0 #b45309, 0 4px 0 #000000;
            animation: floatUpCartoon 0.45s ease-out forwards;
        }
        @keyframes floatUpCartoon {
            0% { transform: translateY(0) scale(0.7) rotate(-8deg); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.1) rotate(8deg); opacity: 0; }
        }

        /* Pulsantone Principale */
        .action-area { width: 100%; display: flex; justify-content: center; margin-bottom: 4px; }
        .btn-allena {
            width: 88vw; max-width: 340px; height: 56px;
            border-radius: 20px; border: 3px solid #ffffff;
            background: linear-gradient(to bottom, #ff7e1a, #e64a00);
            color: #ffffff; font-size: 22px; text-transform: uppercase;
            box-shadow: 0 5px 0 #993300, 0 8px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer; touch-action: manipulation;
            transition: transform 0.05s, box-shadow 0.05s;
            text-shadow: 0 3px 0 #732600, 0 3px 2px rgba(0,0,0,0.6);
        }
        .btn-allena:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #993300, 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .reset-btn { background: transparent; border: none; color: #525866; font-size: 11px; text-decoration: underline; margin: 2px 0 6px 0; cursor: pointer; font-family: 'Nunito', sans-serif; }

        /* AREA SHOP: SISTEMATA CON SCROLL FUNZIONANTE E ALTEZZA DINAMICA */
        .shop {
            width: 100%; 
            background: #111827;
            border-top: 4px solid #1f2937;
            padding: 10px 14px 20px 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            flex-grow: 1; /* Prende tutto lo spazio rimasto in basso */
            overflow-y: auto; /* Permette lo scorrimento verticale dei pulsanti */
            -webkit-overflow-scrolling: touch; /* Rende lo scroll fluidissimo su iOS/Safari */
        }
        
        .btn-shop {
            background: #1f2937; border: 2px solid #374151;
            color: #ffffff; padding: 10px 12px; border-radius: 16px;
            font-size: 12px; display: flex; justify-content: space-between; align-items: center;
            width: 100%; box-shadow: 0 4px 0 #0f172a; cursor: pointer;
            flex-shrink: 0; /* Impedisce ai pulsanti di schiacciarsi */
        }
        .btn-shop span { display: flex; align-items: center; gap: 6px; font-family: 'Nunito', sans-serif; font-weight: 900; text-align: left; }
        .btn-shop b { 
            color: #000000; font-size: 11px; white-space: nowrap;
            background: #fbbf24; padding: 4px 10px; border-radius: 10px; 
            box-shadow: inset 0 -2px 0 #b45309; border: 1px solid #000000;
        }
        .btn-shop:disabled { opacity: 0.3; box-shadow: 0 2px 0 #0f172a; transform: translateY(2px); cursor: not-allowed; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-title">GYM LIFTING<br>HERO 3D</div>
        <div class="loader-spinner"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div id="modal-msg" class="modal-text">Messaggio</div>
            <button class="modal-btn" onclick="chiudiModal()">AVANTI AL PROSSIMO LIVELLO 🚀</button>
        </div>
    </div>

    <header>
        <h1>Gym Lifting Hero 3D</h1>
        <div class="stats-container">
            <div class="stat-card">Forza Totale <span><b id="forza">0</b> kg</span></div>
            <div class="stat-card">Auto-Allenamento <span class="green-glow">+<b id="passivo">0</b> kg/s</span></div>
        </div>
    </header>

    <div class="combo-container">
        <div id="combo-bar" class="combo-bar"></div>
        <div id="combo-text" class="combo-text">Moltiplicatore: x1.0 (0 Hit)</div>
    </div>

    <div id="arena">
        <div id="nome-palestra">Caricamento...</div>
        <div id="fumetto">Ancora un piccolo sforzo! 🏋️‍♂️</div>
    </div>

    <div class="level-progress-container">
        <div id="level-progress-bar" class="level-progress-bar"></div>
    </div>

    <div class="action-area">
        <button class="btn-allena" id="main-clicker">SOLLEVA I PESI! 💪</button>
    </div>

    <button class="reset-btn" onclick="resetGioco()">Azzera Progressi</button>

    <div class="shop">
        <button class="btn-shop" id="upgrade1" onclick="compraUpgrade(1)">
            <span>🎒 Cintura da Sollevamento (+1 kg/s)</span> <b id="costo1">50 kg</b>
        </button>
        <button class="btn-shop" id="upgrade2" onclick="compraUpgrade(2)">
            <span>🥤 Shaker Proteico Avanzato (+8 kg/s)</span> <b id="costo2">300 kg</b>
        </button>
        <button class="btn-shop" id="upgrade3" onclick="compraUpgrade(3)">
            <span>🔥 Supporto del Coach Personale (+50 kg/s)</span> <b id="costo3">2000 kg</b>
        </button>
        <button class="btn-shop" id="upgrade4" onclick="compraUpgrade(4)">
            <span>🛠️ Dischi di Ghisa Extra (+4 kg per Click)</span> <b id="costo4">800 kg</b>
        </button>
    </div>

    <script>
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

        let forza = 0;
        let kgPerClickBase = 1;
        let kgAlSecondo = 0;
        let livelloPalestra = 1;
        
        let costoCintura = 50;
        let costoShaker = 300;
        let costoCoach = 2000;
        let costoGhisa = 800;

        let comboHits = 0;
        let ultimoClickTime = 0;
        let moltiplicatoreCombo = 1.0;
        let modalAttivo = false;

        const palestre = [
            "Livello 1: Ingresso della Manhattan 🧱", 
            "Livello 2: Sala Pesi della Manhattan 🏋️‍♂️",
            "Livello 3: Area Specchi della Manhattan 🪞", 
            "Livello 4: L'Edificio Intero della Manhattan 🏢",
            "Livello 5: La Città di Melito 🏙️💥", 
            "Livello 6: Il Vesuvio (Ghisa Liquida) 🌋",
            "Livello 7: Orbita Terrestre 🌍🛰️", 
            "Livello 8: Il Sistema Solare ☀️",
            "Livello 9: La Via Lattea dei Bicipiti 🌌", 
            "Livello Finale: Il Multiverso Ultra-Grosso 👁️✨"
        ];
        
        const targetForza = [500, 2500, 10000, 40000, 120000, 350000, 1000000, 4000000, 15000000, 50000000];
        const coloriLivelli = ["#ef4444", "#10b981", "#3b82f6", "#a855f7", "#f59e0b", "#ea580c", "#14b8a6", "#f43f5e", "#4b5563", "#ec4899"];

        const incitamenti = [
            "Ancora una ripetizione! Spingi! 🔥",
            "Senti come lavorano i muscoli! 💪",
            "Ottima esecuzione! Continua così! ✨",
            "La ghisa non si solleva da sola! 🏋️‍♂️",
            "Massima contrazione, andiamo! 🧠",
            "Niente scuse, solo vero ferro! 🤬",
            "Stai diventando una macchina! ⚡",
            "Il duro lavoro ripaga sempre! Dai!"
        ];

        let fumettoTimeout;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 3D ENGINE
        let scene, camera, renderer;
        let characterGroup, torsoMesh, leftArm, rightArm, leftDumbbell, rightDumbbell, shortsMesh;
        let speedAnim = 1.0;

        function inizializza3D() {
            const container = document.getElementById('arena');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#242933'); 

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.set(0, 1.8, 4.6);
            camera.lookAt(0, 0.75, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const topLight = new THREE.DirectionalLight(0xffffff, 0.7);
            topLight.position.set(0, 6, 3);
            scene.add(topLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
            fillLight.position.set(0, 2, 5);
            scene.add(fillLight);

            const floorGeo = new THREE.PlaneGeometry(16, 16);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.6 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const floorGrid = new THREE.GridHelper(16, 10, 0x2e3440, 0x2a2f3a);
            floorGrid.position.y = 0.005;
            scene.add(floorGrid);

            const wallGeo = new THREE.PlaneGeometry(16, 6);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3b4252, roughness: 0.8 });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, 2.2, -3.5);
            scene.add(backWall);

            const mirrorFrameGeo = new THREE.PlaneGeometry(5.2, 1.9);
            const mirrorFrameMat = new THREE.MeshStandardMaterial({ color: 0xd8dee9, metalness: 0.8, roughness: 0.2 });
            const mirrorFrame = new THREE.Mesh(mirrorFrameGeo, mirrorFrameMat);
            mirrorFrame.position.set(0, 1.35, -3.48);
            scene.add(mirrorFrame);

            const mirrorGeo = new THREE.PlaneGeometry(5.0, 1.7);
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x88c0d0, roughness: 0.1, metalness: 0.8 });
            const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirror.position.set(0, 1.35, -3.46);
            scene.add(mirror);

            creaRastrellieraCompleta(-2.3, -2.5);
            creaRastrellieraCompleta(2.3, -2.5);

            const platformGeo = new THREE.CylinderGeometry(1.0, 1.1, 0.08, 32);
            const platformMat = new THREE.MeshStandardMaterial({ color: 0x4c566a, roughness: 0.5 });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            platform.position.y = 0.04;
            scene.add(platform);

            characterGroup = new THREE.Group();
            characterGroup.position.set(0, 0.08, 0);
            characterGroup.rotation.y = Math.PI; 

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbb5, roughness: 0.5 });
            const tankTopMat = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.5 }); 
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x434c5e, roughness: 0.6 }); 
            const steelMat = new THREE.MeshStandardMaterial({ color: 0x7b88a3, metalness: 0.8, roughness: 0.2 }); 

            const torsoGeo = new THREE.BoxGeometry(0.5, 0.7, 0.3);
            torsoMesh = new THREE.Mesh(torsoGeo, tankTopMat);
            torsoMesh.position.y = 0.55;
            characterGroup.add(torsoMesh);

            const shortsGeo = new THREE.BoxGeometry(0.51, 0.22, 0.31);
            shortsMesh = new THREE.Mesh(shortsGeo, shortsMat);
            shortsMesh.position.y = 0.18;
            characterGroup.add(shortsMesh);

            const legGeo = new THREE.BoxGeometry(0.18, 0.25, 0.2);
            const leftLeg = new THREE.Mesh(legGeo, skinMat);
            leftLeg.position.set(-0.14, 0.05, 0);
            characterGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, skinMat);
            rightLeg.position.set(0.14, 0.05, 0);
            characterGroup.add(rightLeg);

            const headGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
            const headMesh = new THREE.Mesh(headGeo, skinMat);
            headMesh.position.y = 1.1;
            characterGroup.add(headMesh);

            leftArm = new THREE.Group();
            leftArm.position.set(-0.38, 0.8, 0);
            const armGeo = new THREE.BoxGeometry(0.18, 0.45, 0.18);
            const leftArmMesh = new THREE.Mesh(armGeo, skinMat);
            leftArmMesh.position.y = -0.15;
            leftArm.add(leftArmMesh);

            leftDumbbell = creaManubrioAcciaio(steelMat);
            leftDumbbell.position.set(0, -0.38, 0);
            leftArm.add(leftDumbbell);
            characterGroup.add(leftArm);

            rightArm = new THREE.Group();
            rightArm.position.set(0.38, 0.8, 0);
            const rightArmMesh = new THREE.Mesh(armGeo, skinMat);
            rightArmMesh.position.y = -0.15;
            rightArm.add(rightArmMesh);

            rightDumbbell = creaManubrioAcciaio(steelMat);
            rightDumbbell.position.set(0, -0.38, 0);
            rightArm.add(rightDumbbell);
            characterGroup.add(rightArm);

            scene.add(characterGroup);
            animate();
        }

        function creaRastrellieraCompleta(x, z) {
            const rackGroup = new THREE.Group();
            rackGroup.position.set(x, 0, z);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b4252 });
            const plateMat = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.8 });
            const poleGeo = new THREE.BoxGeometry(0.06, 0.9, 0.4);
            const pole = new THREE.Mesh(poleGeo, frameMat);
            pole.position.set(0, 0.45, 0);
            rackGroup.add(pole);

            for(let i=0; i<3; i++) {
                const diskGeo = new THREE.CylinderGeometry(0.24 - (i*0.01), 0.24 - (i*0.01), 0.06, 16);
                const disk = new THREE.Mesh(diskGeo, plateMat);
                disk.position.set(0, 0.03 + (i*0.06), 0);
                rackGroup.add(disk);
            }
            scene.add(rackGroup);
        }

        function creaManubrioAcciaio(materiale) {
            const group = new THREE.Group();
            const barGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.36, 8);
            const bar = new THREE.Mesh(barGeo, materiale);
            bar.rotation.z = Math.PI / 2;
            group.add(bar);

            const discGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.08, 16);
            const d1 = new THREE.Mesh(discGeo, materiale);
            d1.position.x = -0.13; d1.rotation.z = Math.PI / 2;
            group.add(d1);

            const d2 = new THREE.Mesh(discGeo, materiale);
            d2.position.x = 0.13; d2.rotation.z = Math.PI / 2;
            group.add(d2);
            return group;
        }

        function animate() {
            requestAnimationFrame(animate);
            let time = Date.now() * 0.003 * speedAnim;
            let wave = Math.sin(time) * 0.4 - 0.1;
            leftArm.rotation.x = wave;
            rightArm.rotation.x = -wave;
            if(speedAnim > 1.0) speedAnim -= 0.05;
            renderer.render(scene, camera);
        }

        function aggiornaTaglia3D(percentuale) {
            if(!torsoMesh) return;
            let scaleFactorX = 1.0 + (percentuale / 100) * 1.5; 
            let scaleFactorZ = 1.0 + (percentuale / 100) * 1.0; 

            torsoMesh.scale.set(scaleFactorX, 1.0, scaleFactorZ);
            shortsMesh.scale.set(scaleFactorX, 1.0, scaleFactorZ);
            leftArm.position.x = -0.28 - (0.11 * scaleFactorX);
            rightArm.position.x = 0.28 + (0.11 * scaleFactorX);
            
            let armScale = 1.0 + (percentuale / 100) * 0.8;
            leftArm.scale.set(armScale, 1.0, armScale);
            rightArm.scale.set(armScale, 1.0, armScale);

            let weightScale = 1.0 + (percentuale / 100) * 1.3;
            leftDumbbell.scale.set(weightScale, weightScale, weightScale);
            rightDumbbell.scale.set(weightScale, weightScale, weightScale);

            if (percentuale >= 80 || livelloPalestra > 10) {
                scene.background.setHex(0x3b224c); 
            } else {
                scene.background.setHex(0x242933); 
            }
        }

        function caricaSalvataggi() {
            if (localStorage.getItem('andretta_forza') !== null) {
                forza = parseInt(localStorage.getItem('andretta_forza'));
                let savedClick = localStorage.getItem('andretta_kgclick');
                if(savedClick && !isNaN(savedClick)) kgPerClickBase = parseInt(savedClick);
                kgAlSecondo = parseInt(localStorage.getItem('andretta_kgsecondo'));
                livelloPalestra = parseInt(localStorage.getItem('andretta_livello'));
                costoCintura = parseInt(localStorage.getItem('andretta_costo1'));
                costoShaker = parseInt(localStorage.getItem('andretta_costo2'));
                costoCoach = parseInt(localStorage.getItem('andretta_costo3'));
                costoGhisa = parseInt(localStorage.getItem('andretta_costo4'));
            }
        }

        function salvaProgressi() {
            if (livelloPalestra > 10) return;
            localStorage.setItem('andretta_forza', forza);
            localStorage.setItem('andretta_kgclick', kgPerClickBase);
            localStorage.setItem('andretta_kgsecondo', kgAlSecondo);
            localStorage.setItem('andretta_livello', livelloPalestra);
            localStorage.setItem('andretta_costo1', costoCintura);
            localStorage.setItem('andretta_costo2', costoShaker);
            localStorage.setItem('andretta_costo3', costoCoach);
            localStorage.setItem('andretta_costo4', costoGhisa);
        }

        function resetGioco() {
            if(confirm("Desideri azzerare i tuoi progressi e ricominciare da zero?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            caricaSalvataggi();
            inizializza3D();
            setupLivelloCorrente();
            aggiornaGrafica();
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
            }, 1000); 
        });

        function setupLivelloCorrente() {
            const badge = document.getElementById("nome-palestra");
            if(livelloPalestra <= 10) {
                badge.innerText = palestre[livelloPalestra - 1];
                badge.style.background = coloriLivelli[livelloPalestra - 1];
            } else {
                badge.innerText = "MAESTRO DELLA GHISA ASSOLUTO 👑";
                document.getElementById("main-clicker").disabled = true;
            }
        }

        function playSuono(freq, tipo, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = tipo; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function allenaMatteo(e) {
            if (livelloPalestra > 10 || modalAttivo) return;
            let ora = Date.now();
            if (ora - ultimoClickTime < 900) comboHits += 1;
            else comboHits = 1;
            ultimoClickTime = ora;

            if (comboHits < 5) moltiplicatoreCombo = 1.0;
            else if (comboHits >= 5 && comboHits < 15) moltiplicatoreCombo = 1.5;
            else if (comboHits >= 15 && comboHits < 30) moltiplicatoreCombo = 2.0;
            else moltiplicatoreCombo = 3.0;

            let guadagnoEffettivo = Math.round(kgPerClickBase * moltiplicatoreCombo);
            forza += guadagnoEffettivo;
            speedAnim = Math.min(speedAnim + 1.5, 8.0);

            aggiornaGrafica();
            playSuono(560 + (Math.min(comboHits, 30) * 4), 'sine', 0.04); 
            creaTestoFluttuante("+" + guadagnoEffettivo + " kg");

            if (Math.random() < 0.15) lanciaIncitamento();
            salvaProgressi(); 
            controllaAvanzamento();
        }

        const mainBtn = document.getElementById("main-clicker");
        mainBtn.addEventListener('touchstart', function(e) { e.preventDefault(); allenaMatteo(e); }, {passive: false});
        mainBtn.addEventListener('click', function(e) { if(e.screenX === 0 && e.screenY === 0) return; allenaMatteo(e); });

        setInterval(() => {
            let ora = Date.now();
            if (ora - ultimoClickTime > 1000 && comboHits > 0) {
                comboHits = Math.floor(comboHits * 0.5) - 1;
                if (comboHits < 0) comboHits = 0;
                
                if (comboHits < 5) moltiplicatoreCombo = 1.0;
                else if (comboHits >= 5 && comboHits < 15) moltiplicatoreCombo = 1.5;
                else if (comboHits >= 15 && comboHits < 30) moltiplicatoreCombo = 2.0;
                else moltiplicatoreCombo = 3.0;
                aggiornaGrafica();
            }
        }, 300);

        function lanciaIncitamento() {
            if(modalAttivo) return;
            const fumetto = document.getElementById("fumetto");
            fumetto.innerText = incitamenti[Math.floor(Math.random() * incitamenti.length)];
            fumetto.style.opacity = "1";
            fumetto.style.transform = "translateX(-50%) scale(1)";
            clearTimeout(fumettoTimeout);
            fumettoTimeout = setTimeout(() => {
                fumetto.style.opacity = "0";
                fumetto.style.transform = "translateX(-50%) scale(0.8)";
            }, 1400);
        }

        function creaTestoFluttuante(testo) {
            const arena = document.getElementById("arena");
            const el = document.createElement("div");
            el.className = "floating-text";
            el.innerText = testo;
            el.style.left = (Math.random() * 30 + 35) + "%";
            el.style.top = (Math.random() * 20 + 40) + "%";
            arena.appendChild(el);
            setTimeout(() => el.remove(), 450);
        }

        function compraUpgrade(tipo) {
            if (modalAttivo) return;
            if (tipo === 1 && forza >= costoCintura) {
                forza -= costoCintura; kgAlSecondo += 1; costoCintura = Math.floor(costoCintura * 1.5);
            } else if (tipo === 2 && forza >= costoShaker) {
                forza -= costoShaker; kgAlSecondo += 8; costoShaker = Math.floor(costoShaker * 1.6);
            } else if (tipo === 3 && forza >= costoCoach) {
                forza -= costoCoach; kgAlSecondo += 50; costoCoach = Math.floor(costoCoach * 1.7);
            } else if (tipo === 4 && forza >= costoGhisa) {
                forza -= costoGhisa; kgPerClickBase += 4; costoGhisa = Math.floor(costoGhisa * 1.8);
            }
            playSuono(650, 'triangle', 0.05);
            aggiornaGrafica();
            salvaProgressi();
        }

        setInterval(() => {
            if (kgAlSecondo > 0 && livelloPalestra <= 10 && !modalAttivo) {
                forza += kgAlSecondo;
                aggiornaGrafica();
                salvaProgressi(); 
                controllaAvanzamento();
            }
        }, 1000);

        function mostraModal(testo) {
            modalAttivo = true;
            document.getElementById("modal-msg").innerText = testo;
            document.getElementById("custom-modal").classList.add("show");
        }

        function chiudiModal() {
            document.getElementById("custom-modal").classList.remove("show");
            modalAttivo = false;
            if (livelloPalestra < 10) {
                livelloPalestra += 1;
                let increment = livelloPalestra * 3;
                if(!isNaN(increment)) kgPerClickBase += increment;
                setupLivelloCorrente();
            } else if (livelloPalestra === 10) {
                livelloPalestra = 11;
                forza = 99999999;
                kgAlSecondo = 0;
                setupLivelloCorrente();
            }
            salvaProgressi(); 
            aggiornaGrafica();
        }

        function controllaAvanzamento() {
            if (modalAttivo || livelloPalestra > 10) return; 
            let traguardo = targetForza[livelloPalestra - 1];
            if (forza >= traguardo) {
                forza = 0; 
                playSuono(140, 'sawtooth', 0.35); 
                setTimeout(() => {
                    if (livelloPalestra === 1) mostraModal("🏆 COMPLIMENTI! Hai superato l'Ingresso della Manhattan. Si aprono le porte della Sala Pesi principale!");
                    else if (livelloPalestra === 2) mostraModal("🏆 ECCELLENTE! La Sala Pesi della Manhattan è ormai stretta per i tuoi muscoli. Avanza verso l'Area Specchi!");
                    else if (livelloPalestra === 3) mostraModal("🏆 IMPRESSIONANTE! Hai completato la zona specchi. L'intero Edificio della Manhattan ora trema sotto i tuoi piedi!");
                    else if (livelloPalestra === 4) mostraModal("🏆 DEVASTANTE! La Manhattan è stata conquistata. Espandi il tuo raggio d'azione fino alla città di Melito!");
                    else if (livelloPalestra === 5) mostraModal("🏆 CITTÀ DOMINATA! Melito ha assistito alla nascita di una leggenda. Ora sfida la potenza lavica del Vesuvio!");
                    else if (livelloPalestra === 6) mostraModal("🏆 FORZA VULCANICA! Il Vesuvio si è spento di fronte ai tuoi bicipiti. Spingiti oltre l'atmosfera, verso l'Orbita Terrestre!");
                    else if (livelloPalestra === 7) mostraModal("🏆 ONDA SPAZIALE! L'Orbita Terrestre è tua. Il Sistema Solare intero comincia ad essere attratto dalla tua massa muscolare!");
                    else if (livelloPalestra === 8) mostraModal("🏆 GRAVITÀ SUPERATA! Il Sistema Solare si piega al tuo volere. Prossima tappa: l'intera Via Lattea!");
                    else if (livelloPalestra === 9) mostraModal("🏆 GALASSIA CONQUISTATA! La Via Lattea è dominata. Accedi ora alla fase finale: Il Multiverso!");
                    else mostraModal("👑 DIO SUPREMO DELLA GHISA! Hai completato l'intero percorso d'allenamento e sbloccato il controllo totale del Multiverso! Gioco completato! 🔥💪⚡");
                }, 100);
            }
        }

        function aggiornaGrafica() {
            document.getElementById("forza").innerText = forza;
            document.getElementById("passivo").innerText = kgAlSecondo;
            
            document.getElementById("costo1").innerText = costoCintura + " kg";
            document.getElementById("costo2").innerText = costoShaker + " kg";
            document.getElementById("costo3").innerText = costoCoach + " kg";
            document.getElementById("costo4").innerText = costoGhisa + " kg";

            document.getElementById("upgrade1").disabled = (forza < costoCintura || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade2").disabled = (forza < costoShaker || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade3").disabled = (forza < costoCoach || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade4").disabled = (forza < costoGhisa || livelloPalestra > 10 || modalAttivo);

            const pBar = document.getElementById("level-progress-bar");
            if (livelloPalestra <= 10) {
                let traguardo = targetForza[livelloPalestra - 1];
                let pct = Math.min((forza / traguardo) * 100, 100);
                pBar.style.width = pct + "%";
                aggiornaTaglia3D(pct);
            } else {
                pBar.style.width = "100%";
                aggiornaTaglia3D(100);
            }

            const bar = document.getElementById("combo-bar");
            bar.style.width = Math.min((comboHits / 30) * 100, 100) + "%";
            document.getElementById("combo-text").innerText = `Moltiplicatore: x${moltiplicatoreCombo.toFixed(1)} (${comboHits} Hit)`;
        }

        window.addEventListener('resize', () => {
            if(!renderer) return;
            const container = document.getElementById('arena');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
