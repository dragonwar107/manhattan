<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a73e8">
    
    <title>Gym Lifting Hero 3D - Il Tempio della Ghisa</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght=800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
        }
        
        body {
            background: linear-gradient(180deg, #1d71f2 0%, #0a40a4 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Schermata di Caricamento */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2980b9 0%, #2c3e50 100%);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .loader-title {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #ffcc00;
            text-align: center;
            text-transform: uppercase;
            -webkit-text-stroke: 2px #000;
            text-shadow: 0 6px 0 #d35400;
        }
        .loader-spinner {
            width: 50px; height: 50px;
            border: 6px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #ffcc00;
            animation: spin 0.8s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Intestazione */
        header {
            width: 100%;
            text-align: center;
            padding-top: 10px;
            z-index: 10;
        }
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #ffcc00;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #0a2266;
            text-shadow: 0 4px 0 #ca8a04;
        }
        
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 92vw;
            max-width: 360px;
            margin: 0 auto;
        }
        .stat-card {
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 14px;
            box-shadow: 0 5px 0 #0f3580;
            border: 2px solid #0f3580;
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: #3b82f6;
            text-transform: uppercase;
        }
        .stat-card span {
            display: block;
            font-size: 15px;
            color: #1e293b;
            margin-top: 1px;
        }
        .stat-card span b { color: #e11d48; }

        /* Moltiplicatore Combo */
        .combo-container {
            width: 92vw;
            max-width: 360px;
            margin: 10px auto 0 auto;
            background: #0f2d6e;
            height: 22px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #ffffff;
        }
        .combo-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #e11d48, #f59e0b);
            transition: width 0.1s linear;
        }
        .combo-text {
            position: absolute;
            width: 100%; height: 100%; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: white;
            text-shadow: 0 2px 2px #000;
            text-transform: uppercase;
        }

        /* L'Arena / Finestra sul mondo 3D */
        #arena {
            width: 92vw;
            max-width: 360px;
            height: 38vh;
            max-height: 300px;
            background-color: #2c3e50;
            border: 4px solid #ffffff;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 0 #0a3180, 0 15px 20px rgba(0,0,0,0.3);
            margin: 6px 0;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #nome-palestra {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #ffffff;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 0 #7f1d1d;
            z-index: 5;
            white-space: nowrap;
        }

        /* Nuvoletta Incitamento Coach */
        #fumetto {
            position: absolute; top: 55px; left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: #ffffff; color: #1e293b;
            padding: 6px 12px; border-radius: 14px;
            font-size: 11px; max-width: 200px; text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            border: 2px solid #0a2266;
            opacity: 0; transition: all 0.15s ease; z-index: 10;
        }

        .level-progress-container {
            width: 92vw;
            max-width: 360px;
            height: 14px;
            background: #1e3a8a;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ffffff;
            margin-bottom: 4px;
        }
        .level-progress-bar {
            height: 100%; width: 0%;
            background: #22c55e;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: width 0.2s ease;
        }

        /* Testo Fluttuante Giallo Pop */
        .floating-text {
            position: absolute; color: #ffeb3b; font-size: 28px; font-family: 'Fredoka One', cursive; pointer-events: none; z-index: 10;
            -webkit-text-stroke: 2px #000;
            text-shadow: 0 3px 0 #e65100;
            animation: floatUpCartoon 0.4s ease-out forwards;
        }
        @keyframes floatUpCartoon {
            0% { transform: translateY(0) scale(0.6) rotate(-5deg); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2) rotate(5deg); opacity: 0; }
        }

        /* Pulsantone */
        .action-area { width: 100%; display: flex; justify-content: center; }
        .btn-allena {
            width: 88vw; max-width: 340px; height: 56px;
            border-radius: 20px; border: 2px solid #ffffff;
            background: linear-gradient(to bottom, #ff9800, #e65100);
            color: white; font-family: 'Fredoka One', cursive; font-size: 22px; text-transform: uppercase;
            box-shadow: 0 6px 0 #a33600, 0 10px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer; touch-action: manipulation;
            transition: transform 0.05s, box-shadow 0.05s;
            -webkit-text-stroke: 1.5px #5c1e00;
            letter-spacing: 1px;
        }
        .btn-allena:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a33600, 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        /* Area Shop */
        .shop {
            width: 100%; background: #0f3cb4;
            border-top: 4px solid #ffffff;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
            max-height: 280px; overflow-y: auto;
        }
        .btn-shop {
            background: #1d4ed8; border: 2px solid #ffffff;
            color: #ffffff; padding: 12px 14px; border-radius: 16px;
            font-size: 12px; display: flex; justify-content: space-between; align-items: center;
            width: 100%; box-shadow: 0 4px 0 #0c2366;
        }
        .btn-shop b { color: #000000; font-size: 12px; background: #ffcc00; padding: 4px 10px; border-radius: 10px; box-shadow: inset 0 -2px 0 #ca8a04; }
        .btn-shop:disabled { opacity: 0.4; box-shadow: 0 2px 0 #0c2366; transform: translateY(2px); }

        .reset-btn { background: transparent; border: none; color: #93c5fd; font-size: 10px; text-decoration: underline; margin: 4px 0; }

        /* Schermata Modale Avanzamento */
        #custom-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            z-index: 200; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.2s ease;
        }
        #custom-modal.show { opacity: 1; visibility: visible; }
        .modal-content {
            background: #ffffff; width: 85vw; max-width: 320px;
            padding: 24px; border-radius: 24px; border: 4px solid #ffcc00;
            text-align: center; box-shadow: 0 10px 0 #ca8a04;
        }
        .modal-text { font-size: 15px; color: #1e293b; line-height: 1.5; margin-bottom: 20px; }
        .modal-btn {
            background: #22c55e; border: none; color: white; padding: 12px;
            font-family: 'Fredoka One', cursive; font-size: 16px; text-transform: uppercase; border-radius: 16px;
            width: 100%; box-shadow: 0 5px 0 #15803d;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-title">GYM LIFTING<br>HERO 3D</div>
        <div class="loader-spinner"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div id="modal-msg" class="modal-text">Messaggio</div>
            <button class="modal-btn" onclick="chiudiModal()">AVANTI AL PROSSIMO LIVELLO 🚀</button>
        </div>
    </div>

    <header>
        <h1>Gym Lifting Hero 3D</h1>
        <div class="stats-container">
            <div class="stat-card">Forza Totale <span><b id="forza">0</b> kg</span></div>
            <div class="stat-card">Auto-Allenamento <span>+<b id="passivo">0</b> kg/s</span></div>
        </div>
    </header>

    <div class="combo-container">
        <div id="combo-bar" class="combo-bar"></div>
        <div id="combo-text" class="combo-text">Moltiplicatore: x1.0</div>
    </div>

    <div id="arena">
        <div id="nome-palestra">Caricamento...</div>
        <div id="fumetto">Ancora un piccolo sforzo! 🏋️‍♂️</div>
    </div>

    <div class="level-progress-container">
        <div id="level-progress-bar" class="level-progress-bar"></div>
    </div>

    <div class="action-area">
        <button class="btn-allena" id="main-clicker">SOLLEVA I PESI! 💪</button>
    </div>

    <button class="reset-btn" onclick="resetGioco()">Azzera Progressi</button>

    <div class="shop">
        <button class="btn-shop" id="upgrade1" onclick="compraUpgrade(1)">
            <span>🎒 Cintura da Sollevamento (+1 kg/s)</span> <b id="costo1">50 kg</b>
        </button>
        <button class="btn-shop" id="upgrade2" onclick="compraUpgrade(2)">
            <span>🥤 Shaker Proteico Avanzato (+8 kg/s)</span> <b id="costo2">300 kg</b>
        </button>
        <button class="btn-shop" id="upgrade3" onclick="compraUpgrade(3)">
            <span>🔥 Supporto del Coach Personale (+50 kg/s)</span> <b id="costo3">2000 kg</b>
        </button>
        <button class="btn-shop" id="upgrade4" onclick="compraUpgrade(4)">
            <span>🛠️ Dischi di Ghisa Extra (+4 kg per Click)</span> <b id="costo4">800 kg</b>
        </button>
    </div>

    <script>
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

        let forza = 0;
        let kgPerClickBase = 1;
        let kgAlSecondo = 0;
        let livelloPalestra = 1;
        
        let costoCintura = 50;
        let costoShaker = 300;
        let costoCoach = 2000;
        let costoGhisa = 800;

        let comboHits = 0;
        let ultimoClickTime = 0;
        let moltiplicatoreCombo = 1.0;
        let modalAttivo = false;

        // Testi ripristinati e corretti grammaticalmente
        const palestre = [
            "Livello 1: Ingresso della Manhattan 🧱", 
            "Livello 2: Sala Pesi della Manhattan 🏋️‍♂️",
            "Livello 3: Area Specchi e Cardio della Manhattan 🪞", 
            "Livello 4: L'Intero Edificio della Manhattan 🏢",
            "Livello 5: La Città di Melito 🏙️💥", 
            "Livello 6: Il Vesuvio (Ghisa Liquida) 🌋",
            "Livello 7: Orbita Terrestre 🌍🛰️", 
            "Livello 8: Il Sistema Solare ☀️",
            "Livello 9: La Via Lattea dei Bicipiti 🌌", 
            "Livello Final: Il Multiverso Ultra-Grosso 👁️✨"
        ];
        
        const targetForza = [500, 2500, 10000, 40000, 120000, 350000, 1000000, 4000000, 15000000, 50000000];
        const coloriLivelli = ["#ef4444", "#22c55e", "#3b82f6", "#a855f7", "#eab308", "#f97316", "#14b8a6", "#f97316", "#475569", "#ec4899"];

        const incitamenti = [
            "Ancora una ripetizione! Non mollare! 🔥",
            "Senti i muscoli che lavorano! 💪",
            "Ottima tecnica! Continua così! ✨",
            "La ghisa non si solleva da sola! Spingi! 🏋️‍♂️",
            "Concentrati sulla contrazione! 🧠",
            "Niente scuse, solo duro lavoro! 🤬",
            "Stai diventando una macchina! ⚡",
            "Il successo richiede costanza! Dai!"
        ];

        let fumettoTimeout;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // MOTORE PALESTRA 3D
        let scene, camera, renderer;
        let characterGroup, torsoMesh, headMesh, leftArm, rightArm, leftDumbbell, rightDumbbell;
        let shortsMesh;
        let speedAnim = 1.0;

        function inizializza3D() {
            const container = document.getElementById('arena');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#3a4454'); // Atmosfera industriale da palestra

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.set(0, 2.0, 4.8);
            camera.lookAt(0, 0.9, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const spotLight = new THREE.SpotLight(0xffffff, 0.8);
            spotLight.position.set(2, 5, 4);
            scene.add(spotLight);

            // Pavimento gommato a scacchi scuri da sala pesi
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x22252c, roughness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(20, 20, 0x4f46e5, 0x374151);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Muro di fondo della palestra
            const wallGeo = new THREE.PlaneGeometry(20, 6);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.7 });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, 3, -4);
            scene.add(backWall);

            // Specchio stilizzato sul muro di fondo
            const mirrorGeo = new THREE.PlaneGeometry(6, 2.5);
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x93c5fd, roughness: 0.1, metalness: 0.9 });
            const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirror.position.set(0, 2.2, -3.95);
            scene.add(mirror);

            // Rastrelliere dischi decorative ai lati
            creaRastrellieraPesi(-2.2, -3.5);
            creaRastrellieraPesi(2.2, -3.5);

            // Pedana circolare neon da sollevamento sotto l'atleta
            const podiumGeo = new THREE.CylinderGeometry(1.1, 1.2, 0.12, 32);
            const podiumMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.3, metalness: 0.2 });
            const podium = new THREE.Mesh(podiumGeo, podiumMat);
            podium.position.y = 0.06;
            scene.add(podium);

            // CREAZIONE PERSONAGGIO STILE ROBLOX CARTOON
            characterGroup = new THREE.Group();
            characterGroup.position.set(0, 0.12, 0);

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.4 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 }); // Pantaloncini mimetici
            const weightMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.7, roughness: 0.3 });

            // Torso (Canotta)
            const torsoGeo = new THREE.BoxGeometry(0.5, 0.7, 0.3);
            torsoMesh = new THREE.Mesh(torsoGeo, shirtMat);
            torsoMesh.position.y = 0.55;
            characterGroup.add(torsoMesh);

            // Pantaloncini
            const shortsGeo = new THREE.BoxGeometry(0.52, 0.22, 0.32);
            shortsMesh = new THREE.Mesh(shortsGeo, shortsMat);
            shortsMesh.position.y = 0.18;
            characterGroup.add(shortsMesh);

            // Gambe stabili a blocchi
            const legGeo = new THREE.BoxGeometry(0.18, 0.25, 0.2);
            const leftLeg = new THREE.Mesh(legGeo, skinMat);
            leftLeg.position.set(-0.14, 0.05, 0);
            characterGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, skinMat);
            rightLeg.position.set(0.14, 0.05, 0);
            characterGroup.add(rightLeg);

            // Testa quadrata
            const headGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
            headMesh = new THREE.Mesh(headGeo, skinMat);
            headMesh.position.y = 1.1;
            characterGroup.add(headMesh);

            // Braccio Sinistro articolato
            leftArm = new THREE.Group();
            leftArm.position.set(-0.38, 0.8, 0);
            const armGeo = new THREE.BoxGeometry(0.18, 0.45, 0.18);
            const leftArmMesh = new THREE.Mesh(armGeo, skinMat);
            leftArmMesh.position.y = -0.15;
            leftArm.add(leftArmMesh);

            leftDumbbell = creaManubrio3D(weightMat);
            leftDumbbell.position.set(0, -0.38, 0);
            leftArm.add(leftDumbbell);
            characterGroup.add(leftArm);

            // Braccio Destro articolato
            rightArm = new THREE.Group();
            rightArm.position.set(0.38, 0.8, 0);
            const rightArmMesh = new THREE.Mesh(armGeo, skinMat);
            rightArmMesh.position.y = -0.15;
            rightArm.add(rightArmMesh);

            rightDumbbell = creaManubrio3D(weightMat);
            rightDumbbell.position.set(0, -0.38, 0);
            rightArm.add(rightDumbbell);
            characterGroup.add(rightArm);

            scene.add(characterGroup);

            animate();
        }

        function creaRastrellieraPesi(x, z) {
            const rackGroup = new THREE.Group();
            rackGroup.position.set(x, 0, z);

            const ironMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
            const plateMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.6 });

            const poleGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8);
            const pole = new THREE.Mesh(poleGeo, ironMat);
            pole.position.y = 0.6;
            rackGroup.add(pole);

            for(let i=0; i<4; i++) {
                const plateGeo = new THREE.CylinderGeometry(0.28 - (i*0.02), 0.28 - (i*0.02), 0.08, 16);
                const plate = new THREE.Mesh(plateGeo, plateMat);
                plate.position.y = 0.04 + (i * 0.08);
                rackGroup.add(plate);
            }
            scene.add(rackGroup);
        }

        function creaManubrio3D(materiale) {
            const group = new THREE.Group();
            const barGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.38, 8);
            const bar = new THREE.Mesh(barGeo, materiale);
            bar.rotation.z = Math.PI / 2;
            group.add(bar);

            const discGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.07, 16);
            const d1 = new THREE.Mesh(discGeo, materiale);
            d1.position.x = -0.14;
            d1.rotation.z = Math.PI / 2;
            group.add(d1);

            const d2 = new THREE.Mesh(discGeo, materiale);
            d2.position.x = 0.14;
            d2.rotation.z = Math.PI / 2;
            group.add(d2);
            return group;
        }

        function animate() {
            requestAnimationFrame(animate);

            let time = Date.now() * 0.003 * speedAnim;
            let wave = Math.sin(time) * 0.38 - 0.15;
            
            leftArm.rotation.x = wave;
            rightArm.rotation.x = wave;

            if(speedAnim > 1.0) speedAnim -= 0.04;

            renderer.render(scene, camera);
        }

        function aggiornaTaglia3D(percentuale) {
            if(!torsoMesh) return;

            let scaleFactorX = 1.0 + (percentuale / 100) * 1.4; 
            let scaleFactorZ = 1.0 + (percentuale / 100) * 0.9; 

            torsoMesh.scale.set(scaleFactorX, 1.0, scaleFactorZ);
            shortsMesh.scale.set(scaleFactorX, 1.0, scaleFactorZ);
            
            leftArm.position.x = -0.28 - (0.1 * scaleFactorX);
            rightArm.position.x = 0.28 + (0.1 * scaleFactorX);
            
            let armScale = 1.0 + (percentuale / 100) * 0.7;
            leftArm.scale.set(armScale, 1.0, armScale);
            rightArm.scale.set(armScale, 1.0, armScale);

            let weightScale = 1.0 + (percentuale / 100) * 1.2;
            leftDumbbell.scale.set(weightScale, weightScale, weightScale);
            rightDumbbell.scale.set(weightScale, weightScale, weightScale);

            if (percentuale >= 80 || livelloPalestra > 5) {
                scene.background.setHex(0x4c1d95); // Aura energetica viola
            } else {
                scene.background.setHex(0x3a4454); 
            }
        }

        function caricaSalvataggi() {
            if (localStorage.getItem('andretta_forza') !== null) {
                forza = parseInt(localStorage.getItem('andretta_forza'));
                let savedClick = localStorage.getItem('andretta_kgclick');
                if(savedClick && !isNaN(savedClick)) kgPerClickBase = parseInt(savedClick);
                kgAlSecondo = parseInt(localStorage.getItem('andretta_kgsecondo'));
                livelloPalestra = parseInt(localStorage.getItem('andretta_livello'));
                costoCintura = parseInt(localStorage.getItem('andretta_costo1'));
                costoShaker = parseInt(localStorage.getItem('andretta_costo2'));
                costoCoach = parseInt(localStorage.getItem('andretta_costo3'));
                costoGhisa = parseInt(localStorage.getItem('andretta_costo4'));
            }
        }

        function salvaProgressi() {
            if (livelloPalestra > 10) return;
            localStorage.setItem('andretta_forza', forza);
            localStorage.setItem('andretta_kgclick', kgPerClickBase);
            localStorage.setItem('andretta_kgsecondo', kgAlSecondo);
            localStorage.setItem('andretta_livello', livelloPalestra);
            localStorage.setItem('andretta_costo1', costoCintura);
            localStorage.setItem('andretta_costo2', costoShaker);
            localStorage.setItem('andretta_costo3', costoCoach);
            localStorage.setItem('andretta_costo4', costoGhisa);
        }

        function resetGioco() {
            if(confirm("Desideri azzerare i tuoi progressi e ricominciare il tuo percorso di allenamento da zero?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            caricaSalvataggi();
            inizializza3D();
            setupLivelloCorrente();
            aggiornaGrafica();

            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.visibility = 'hidden'; }, 400);
            }, 1000); 
        });

        function setupLivelloCorrente() {
            const badge = document.getElementById("nome-palestra");
            if(livelloPalestra <= 10) {
                badge.innerText = palestre[livelloPalestra - 1];
                badge.style.background = coloriLivelli[livelloPalestra - 1];
            } else {
                badge.innerText = "MAESTRO DELLA GHISA ASSOLUTO 👑";
                document.getElementById("main-clicker").disabled = true;
            }
        }

        function playSuono(freq, tipo, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = tipo; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function allenaMatteo(e) {
            if (livelloPalestra > 10 || modalAttivo) return;
            let ora = Date.now();
            
            if (ora - ultimoClickTime < 900) comboHits += 1;
            else comboHits = 1;
            ultimoClickTime = ora;

            if (comboHits < 5) moltiplicatoreCombo = 1.0;
            else if (comboHits >= 5 && comboHits < 15) moltiplicatoreCombo = 1.5;
            else if (comboHits >= 15 && comboHits < 30) moltiplicatoreCombo = 2.0;
            else moltiplicatoreCombo = 3.0;

            let guadagnoEffettivo = Math.round(kgPerClickBase * moltiplicatoreCombo);
            forza += guadagnoEffettivo;
            
            speedAnim = Math.min(speedAnim + 1.4, 7.5);

            aggiornaGrafica();
            playSuono(560 + (Math.min(comboHits, 30) * 4), 'sine', 0.04); 

            creaTestoFluttuante("+" + guadagnoEffettivo + " kg");

            if (Math.random() < 0.15) lanciaIncitamento();

            salvaProgressi(); 
            controllaAvanzamento();
        }

        const mainBtn = document.getElementById("main-clicker");
        mainBtn.addEventListener('touchstart', function(e) { e.preventDefault(); allenaMatteo(e); }, {passive: false});
        mainBtn.addEventListener('click', function(e) { if(e.screenX === 0 && e.screenY === 0) return; allenaMatteo(e); });

        setInterval(() => {
            let ora = Date.now();
            if (ora - ultimoClickTime > 1000 && comboHits > 0) {
                comboHits = Math.floor(comboHits * 0.5) - 1;
                if (comboHits < 0) comboHits = 0;
                
                if (comboHits < 5) moltiplicatoreCombo = 1.0;
                else if (comboHits >= 5 && comboHits < 15) moltiplicatoreCombo = 1.5;
                else if (comboHits >= 15 && comboHits < 30) moltiplicatoreCombo = 2.0;
                else moltiplicatoreCombo = 3.0;

                const bar = document.getElementById("combo-bar");
                bar.style.width = Math.min((comboHits / 30) * 100, 100) + "%";
                document.getElementById("combo-text").innerText = `Moltiplicatore: x${moltiplicatoreCombo.toFixed(1)} (${comboHits} Hit)`;
                aggiornaGrafica();
            }
        }, 300);

        function lanciaIncitamento() {
            if(modalAttivo) return;
            const fumetto = document.getElementById("fumetto");
            fumetto.innerText = incitamenti[Math.floor(Math.random() * incitamenti.length)];
            fumetto.style.opacity = "1";
            fumetto.style.transform = "translateX(-50%) scale(1)";
            
            clearTimeout(fumettoTimeout);
            fumettoTimeout = setTimeout(() => {
                fumetto.style.opacity = "0";
                fumetto.style.transform = "translateX(-50%) scale(0.8)";
            }, 1400);
        }

        function creaTestoFluttuante(testo) {
            const arena = document.getElementById("arena");
            const el = document.createElement("div");
            el.className = "floating-text";
            el.innerText = testo;
            el.style.left = (Math.random() * 30 + 35) + "%";
            el.style.top = (Math.random() * 20 + 40) + "%";
            arena.appendChild(el);
            setTimeout(() => el.remove(), 400);
        }

        function compraUpgrade(tipo) {
            if (modalAttivo) return;
            if (tipo === 1 && forza >= costoCintura) {
                forza -= costoCintura; kgAlSecondo += 1; costoCintura = Math.floor(costoCintura * 1.5);
            } else if (tipo === 2 && forza >= costoShaker) {
                forza -= costoShaker; kgAlSecondo += 8; costoShaker = Math.floor(costoShaker * 1.6);
            } else if (tipo === 3 && forza >= costoCoach) {
                forza -= costoCoach; kgAlSecondo += 50; costoCoach = Math.floor(costoCoach * 1.7);
            } else if (tipo === 4 && forza >= costoGhisa) {
                forza -= costoGhisa; kgPerClickBase += 4; costoGhisa = Math.floor(costoGhisa * 1.8);
            }
            playSuono(650, 'triangle', 0.05);
            aggiornaGrafica();
            salvaProgressi();
        }

        setInterval(() => {
            if (kgAlSecondo > 0 && livelloPalestra <= 10 && !modalAttivo) {
                forza += kgAlSecondo;
                aggiornaGrafica();
                salvaProgressi(); 
                controllaAvanzamento();
            }
        }, 1000);

        function mostraModal(testo) {
            modalAttivo = true;
            document.getElementById("modal-msg").innerText = testo;
            document.getElementById("custom-modal").classList.add("show");
        }

        function chiudiModal() {
            document.getElementById("custom-modal").classList.remove("show");
            modalAttivo = false;
            
            if (livelloPalestra < 10) {
                livelloPalestra += 1;
                kgPerClickBase += (livelloPalestra * 3);
                setupLivelloCorrente();
            } else if (livelloPalestra === 10) {
                livelloPalestra = 11;
                forza = 99999999;
                kgAlSecondo = 0;
                setupLivelloCorrente();
            }
            salvaProgressi(); 
            aggiornaGrafica();
        }

        function controllaAvanzamento() {
            if (modalAttivo || livelloPalestra > 10) return; 
            let traguardo = targetForza[livelloPalestra - 1];
            if (forza >= traguardo) {
                forza = 0; 
                playSuono(140, 'sawtooth', 0.35); 
                
                setTimeout(() => {
                    if (livelloPalestra === 1) mostraModal("🏆 COMPLIMENTI! Hai superato l'Ingresso della Manhattan. Si aprono le porte della Sala Pesi principale!");
                    else if (livelloPalestra === 2) mostraModal("🏆 ECCELLENTE! La Sala Pesi della Manhattan è ormai stretta per i tuoi muscoli. Avanza verso l'Area Specchi e Cardio!");
                    else if (livelloPalestra === 3) mostraModal("🏆 IMPRESSIONANTE! Hai completato la zona specchi. L'intero Edificio della Manhattan ora trema sotto i tuoi piedi!");
                    else if (livelloPalestra === 4) mostraModal("🏆 DEVASTANTE! La Manhattan è stata conquistata. Espandi il tuo raggio d'azione fino alla città di Melito!");
                    else if (livelloPalestra === 5) mostraModal("🏆 CITTÀ DOMINATA! Melito ha assistito alla nascita di una leggenda. Ora sfida la potenza lavica del Vesuvio!");
                    else if (livelloPalestra === 6) mostraModal("🏆 FORZA VULCANICA! Il Vesuvio si è spento di fronte ai tuoi bicipiti. Spingiti oltre l'atmosfera, verso l'Orbita Terrestre!");
                    else if (livelloPalestra === 7) mostraModal("🏆 ONDA SPAZIALE! L'Orbita Terrestre è tua. Il Sistema Solare intero comincia ad essere attratto dalla tua massa muscolare!");
                    else if (livelloPalestra === 8) mostraModal("🏆 GRAVITÀ SUPERATA! Il Sistema Solare si piega al tuo volere. Prossima tappa: l'intera Via Lattea!");
                    else if (livelloPalestra === 9) mostraModal("🏆 GALASSIA CONQUISTATA! La Via Lattea è dominata. Accedi ora alla fase finale: Il Multiverso!");
                    else mostraModal("👑 DIO SUPREMO DELLA GHISA! Hai completato l'intero percorso d'allenamento e sbloccato il controllo totale del Multiverso! Il tuo corpo ha raggiunto il potenziale massimo. Gioco completato! 🔥💪⚡");
                }, 100);
            }
        }

        function aggiornaGrafica() {
            document.getElementById("forza").innerText = forza;
            document.getElementById("passivo").innerText = kgAlSecondo;
            
            document.getElementById("costo1").innerText = costoCintura + " kg";
            document.getElementById("costo2").innerText = costoShaker + " kg";
            document.getElementById("costo3").innerText = costoCoach + " kg";
            document.getElementById("costo4").innerText = costoGhisa + " kg";

            document.getElementById("upgrade1").disabled = (forza < costoCintura || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade2").disabled = (forza < costoShaker || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade3").disabled = (forza < costoCoach || livelloPalestra > 10 || modalAttivo);
            document.getElementById("upgrade4").disabled = (forza < costoGhisa || livelloPalestra > 10 || modalAttivo);

            const pBar = document.getElementById("level-progress-bar");
            if (livelloPalestra <= 10) {
                let traguardo = targetForza[livelloPalestra - 1];
                let pct = Math.min((forza / traguardo) * 100, 100);
                pBar.style.width = pct + "%";
                
                aggiornaTaglia3D(pct);
            } else {
                pBar.style.width = "100%";
                aggiornaTaglia3D(100);
            }

            const bar = document.getElementById("combo-bar");
            bar.style.width = Math.min((comboHits / 30) * 100, 100) + "%";
            document.getElementById("combo-text").innerText = `Moltiplicatore: x${moltiplicatoreCombo.toFixed(1)} (${comboHits} Hit)`;
        }

        window.addEventListener('resize', () => {
            if(!renderer) return;
            const container = document.getElementById('arena');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
